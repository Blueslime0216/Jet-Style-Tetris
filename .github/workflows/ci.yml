name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.98.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:engine
      - run: npm run check
      - run: cargo clippy --manifest-path rust/engine-host/Cargo.toml --locked -- -D warnings
      - run: node knowledge/validate.cjs
